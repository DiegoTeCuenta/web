<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diego Te Cuenta</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--gold:#d4a832;--white:#f5f2ee;--black:#000}
html{scroll-behavior:auto}
body{background:var(--black);color:var(--white);font-family:"DM Sans",sans-serif}

/* SCROLL TRACK — this is what gives us scroll distance */
.scroll-track{height:500vh;position:relative}

/* STICKY VIEWPORT */
.sticky-stage{position:sticky;top:0;height:100vh;height:100svh;width:100%;overflow:hidden;background:#000}

/* CANVAS */
#hero-canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}

/* LOADING */
.loader{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;background:#000;transition:opacity 0.8s}
.loader.hidden{opacity:0;pointer-events:none}
.loader-bar{width:160px;height:1px;background:rgba(212,168,50,0.15);position:relative;overflow:hidden;margin-top:20px}
.loader-fill{height:100%;background:var(--gold);width:0%;transition:width 0.2s}
.loader-txt{font-size:9px;letter-spacing:0.35em;text-transform:uppercase;color:rgba(212,168,50,0.6)}

/* BRAND — fades out early */
.brand-layer{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;pointer-events:none;text-align:center;padding:0 24px}
.brand{font-family:"Cormorant Garamond",serif;font-size:clamp(30px,5vw,58px);font-weight:300;letter-spacing:0.08em;color:rgba(245,242,238,0.95);text-shadow:0 2px 30px rgba(0,0,0,0.9)}
.brand em{font-style:italic;color:var(--gold)}
.brand-sub{font-size:9px;letter-spacing:0.4em;text-transform:uppercase;color:rgba(245,242,238,0.5);margin-top:14px}

/* SCROLL CUE — prominent */
.cue{position:absolute;bottom:44px;left:50%;transform:translateX(-50%);z-index:14;display:flex;flex-direction:column;align-items:center;gap:14px;pointer-events:none}

/* halo behind so it reads over any frame */
.cue::before{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:230px;height:150px;background:radial-gradient(ellipse,rgba(0,0,0,0.75) 0%,transparent 70%);z-index:-1}

.cue-mouse{width:26px;height:42px;border:1.5px solid rgba(212,168,50,0.85);border-radius:14px;position:relative;box-shadow:0 0 18px rgba(212,168,50,0.25)}
.cue-wheel{position:absolute;left:50%;top:8px;width:3px;height:8px;background:var(--gold);border-radius:2px;transform:translateX(-50%);animation:wheelDrop 1.8s ease-in-out infinite}
@keyframes wheelDrop{
  0%   {opacity:0;transform:translateX(-50%) translateY(0)}
  25%  {opacity:1}
  75%  {opacity:1;transform:translateX(-50%) translateY(14px)}
  100% {opacity:0;transform:translateX(-50%) translateY(16px)}
}

.cue-txt{font-size:10px;letter-spacing:0.32em;text-transform:uppercase;color:rgba(245,242,238,0.85);text-shadow:0 2px 12px rgba(0,0,0,0.9)}

.cue-arrows{display:flex;flex-direction:column;align-items:center;gap:1px;margin-top:-4px}
.cue-arrow{width:11px;height:11px;border-right:1.5px solid var(--gold);border-bottom:1.5px solid var(--gold);transform:rotate(45deg);opacity:0;animation:arrowFall 1.8s ease-in-out infinite}
.cue-arrow:nth-child(1){animation-delay:0s}
.cue-arrow:nth-child(2){animation-delay:0.18s}
.cue-arrow:nth-child(3){animation-delay:0.36s}
@keyframes arrowFall{0%{opacity:0;transform:rotate(45deg) translate(-4px,-4px)}50%{opacity:1}100%{opacity:0;transform:rotate(45deg) translate(4px,4px)}}

/* CTA — fades in at the end */
.cta-layer{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:15;opacity:0;pointer-events:none;text-align:center;padding:0 24px}
.cta-layer.on{pointer-events:auto}
.cta-eyebrow{font-size:9px;letter-spacing:0.35em;text-transform:uppercase;color:rgba(212,168,50,0.8);margin-bottom:16px}
.cta-title{font-family:"Cormorant Garamond",serif;font-size:clamp(32px,5.5vw,64px);font-weight:300;line-height:1.05;margin-bottom:32px}
.cta-title em{font-style:italic;color:var(--gold)}
.cta-btn{display:inline-flex;align-items:center;gap:12px;font-size:10px;letter-spacing:0.28em;text-transform:uppercase;color:rgba(245,242,238,0.85);text-decoration:none;border:0.5px solid rgba(212,168,50,0.5);padding:15px 34px;transition:all 0.35s;background:rgba(0,0,0,0.4);backdrop-filter:blur(6px)}
.cta-btn:hover{background:rgba(212,168,50,0.12);border-color:var(--gold);color:var(--gold);gap:18px}

/* CORNERS */
.corner{position:absolute;font-size:9px;letter-spacing:0.22em;text-transform:uppercase;color:rgba(245,242,238,0.25);z-index:12;pointer-events:none}
.tl{top:26px;left:28px}
.tr{top:26px;right:28px}

/* CURSOR — desktop */
@media(pointer:fine){
  body{cursor:none}
  .cur{position:fixed;width:8px;height:8px;background:var(--gold);border-radius:50%;pointer-events:none;z-index:999;transform:translate(-50%,-50%)}
  .cur-ring{position:fixed;width:32px;height:32px;border:1px solid rgba(212,168,50,0.45);border-radius:50%;pointer-events:none;z-index:998;transform:translate(-50%,-50%);transition:width 0.25s,height 0.25s,border-color 0.25s}
}
@media(pointer:coarse){.cur,.cur-ring{display:none}}
</style>
</head>
<body>

<div class="cur" id="cur"></div>
<div class="cur-ring" id="ring"></div>

<div class="scroll-track">
  <div class="sticky-stage">

    <canvas id="hero-canvas"></canvas>

    <div class="corner tl">diegotecuenta.com</div>
    <div class="corner tr">Miami, FL</div>

    <!-- LOADER -->
    <div class="loader" id="loader">
      <div class="loader-txt">Loading</div>
      <div class="loader-bar"><div class="loader-fill" id="loader-fill"></div></div>
    </div>

    <!-- BRAND -->
    <div class="brand-layer" id="brand-layer">
      <div class="brand">diego<em>te</em>cuenta</div>
      <div class="brand-sub">30 years of proof</div>
    </div>

    <!-- SCROLL CUE -->
    <div class="cue" id="cue">
      <div class="cue-mouse"><div class="cue-wheel"></div></div>
      <div class="cue-txt">Scroll</div>
      <div class="cue-arrows">
        <span class="cue-arrow"></span>
        <span class="cue-arrow"></span>
        <span class="cue-arrow"></span>
      </div>
    </div>

    <!-- CTA -->
    <div class="cta-layer" id="cta-layer">
      <div class="cta-eyebrow">Commercial Work</div>
      <div class="cta-title">Mapping · Club visuals<br><em>AI characters · AI video</em></div>
      <a class="cta-btn" href="work_index.html">Enter the work &nbsp;→</a>
    </div>

  </div>
</div>

<script>
// ============ CONFIG ============
const FRAME_COUNT = 180;
const FRAME_PATH  = 'assets/hero/';
const framePath = i => `${FRAME_PATH}hero00${i}.webp`;

// ============ CANVAS ============
const canvas = document.getElementById('hero-canvas');
const ctx = canvas.getContext('2d', { alpha: false });
const images = [];
let loadedCount = 0;
let currentFrame = 1;
let ready = false;

function sizeCanvas(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width  = window.innerWidth  * dpr;
  canvas.height = window.innerHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if(ready) drawFrame(currentFrame);
}
window.addEventListener('resize', sizeCanvas);

// Cover-fit draw
function drawFrame(i){
  const img = images[i - 1];
  if(!img || !img.complete || !img.naturalWidth) return;
  const vw = window.innerWidth, vh = window.innerHeight;
  const ir = img.naturalWidth / img.naturalHeight;
  const vr = vw / vh;
  let dw, dh, dx, dy;
  if(vr > ir){ dw = vw; dh = vw / ir; dx = 0; dy = (vh - dh) / 2; }
  else       { dh = vh; dw = vh * ir; dy = 0; dx = (vw - dw) / 2; }
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, vw, vh);
  ctx.drawImage(img, dx, dy, dw, dh);
}

// ============ PRELOAD ============
const loaderEl = document.getElementById('loader');
const loaderFill = document.getElementById('loader-fill');

function preload(){
  for(let i = 1; i <= FRAME_COUNT; i++){
    const img = new Image();
    img.decoding = 'async';
    img.onload = img.onerror = () => {
      loadedCount++;
      loaderFill.style.width = (loadedCount / FRAME_COUNT * 100) + '%';
      if(loadedCount === 1){ ready = true; drawFrame(1); }
      if(loadedCount >= FRAME_COUNT){
        loaderEl.classList.add('hidden');
        drawFrame(currentFrame);
      }
    };
    img.src = framePath(i);
    images.push(img);
  }
}

// ============ SCROLL SCRUB ============
const track = document.querySelector('.scroll-track');
const brandLayer = document.getElementById('brand-layer');
const ctaLayer = document.getElementById('cta-layer');
const cue = document.getElementById('cue');

let ticking = false;

function onScroll(){
  if(ticking) return;
  ticking = true;
  requestAnimationFrame(() => {
    ticking = false;
    const maxScroll = track.offsetHeight - window.innerHeight;
    const p = Math.max(0, Math.min(1, window.scrollY / maxScroll));

    // frame
    const frame = Math.min(FRAME_COUNT, Math.max(1, Math.round(p * (FRAME_COUNT - 1)) + 1));
    if(frame !== currentFrame){
      currentFrame = frame;
      drawFrame(frame);
    }

    // brand fades out 0 → 0.15
    brandLayer.style.opacity = String(Math.max(0, 1 - p / 0.15));

    // cue fades out 0 → 0.08
    cue.style.opacity = String(Math.max(0, 1 - p / 0.14));

    // CTA fades in 0.82 → 0.95
    const ctaP = Math.max(0, Math.min(1, (p - 0.82) / 0.13));
    ctaLayer.style.opacity = String(ctaP);
    ctaLayer.classList.toggle('on', ctaP > 0.5);
  });
}
window.addEventListener('scroll', onScroll, { passive: true });

// ============ CURSOR ============
const cur = document.getElementById('cur'), ring = document.getElementById('ring');
if(window.matchMedia('(pointer:fine)').matches){
  let mx = innerWidth/2, my = innerHeight/2, rx = mx, ry = my;
  document.addEventListener('mousemove', e => {
    mx = e.clientX; my = e.clientY;
    cur.style.left = mx+'px'; cur.style.top = my+'px';
  });
  (function loop(){
    rx += (mx-rx)*0.12; ry += (my-ry)*0.12;
    ring.style.left = rx+'px'; ring.style.top = ry+'px';
    requestAnimationFrame(loop);
  })();
  document.addEventListener('mouseover', e => {
    if(e.target.closest('a')){ ring.style.width='54px'; ring.style.height='54px'; ring.style.borderColor='rgba(212,168,50,0.8)'; }
  });
  document.addEventListener('mouseout', e => {
    if(e.target.closest('a')){ ring.style.width='32px'; ring.style.height='32px'; ring.style.borderColor='rgba(212,168,50,0.45)'; }
  });
}

// ============ INIT ============
sizeCanvas();
preload();
onScroll();
</script>
</body>
</html>
